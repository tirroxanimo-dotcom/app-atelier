<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gabi Rometal">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Gabi Rometal — Control</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#0a0e1a;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    user-select:none; -webkit-user-select:none; }
  #bg { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }

  #glows, #cerlayer { position:fixed; inset:0; z-index:1; pointer-events:none; }
  .geam { position:absolute; border-radius:3px;
    background:radial-gradient(ellipse at center, rgba(255,201,112,0.95), rgba(255,170,60,0.4) 55%, rgba(255,160,50,0) 100%);
    filter:blur(4px); opacity:0; transition:opacity .45s ease; mix-blend-mode:screen; }
  .geam.on { opacity:1; }
  .lampa { position:absolute; border-radius:50%; transform:translate(-50%,-50%);
    background:radial-gradient(circle at center, rgba(255,214,135,0.92), rgba(255,178,72,0.38) 45%, rgba(255,160,50,0) 75%);
    filter:blur(6px); opacity:0; transition:opacity .45s ease; mix-blend-mode:screen; }
  .lampa.on { opacity:1; }
  .cer { position:absolute; border-radius:50%; transform:translate(-50%,-50%);
    background:radial-gradient(ellipse at center, rgba(255,196,120,0.55), rgba(255,172,80,0.22) 42%, rgba(255,160,60,0) 70%);
    filter:blur(26px); opacity:0; transition:opacity .6s ease; mix-blend-mode:screen; }
  .cer.on { opacity:1; }

  #sus { position:fixed; z-index:3; top:calc(5vh + env(safe-area-inset-top));
    left:50%; transform:translateX(-50%); width:min(92%,430px);
    display:grid; grid-template-columns:1fr 1fr; gap:11px 11px; }
  .pill { width:100%; background:transparent; border:1.5px solid rgba(255,255,255,0.4); border-radius:999px;
    color:rgba(255,255,255,0.75); padding:10px 6px; font-size:clamp(10.5px,3.1vw,13px); font-weight:600; letter-spacing:0.3px; touch-action:manipulation;
    white-space:nowrap; text-align:center; text-shadow:0 1px 4px rgba(0,0,0,0.8); cursor:pointer;
    transition:border-color .35s ease, color .35s ease, box-shadow .35s ease, text-shadow .35s ease; }
  .pill:active { transform:scale(0.96); }
  .pill.on { border-color:#ffcf6b; color:#ffcf6b;
    box-shadow:0 0 20px rgba(255,179,71,0.55), inset 0 0 14px rgba(255,179,71,0.18);
    text-shadow:0 0 14px rgba(255,179,71,0.95); }
  /* lumina fara Shelly asignat inca — un punct mic sa stii care nu-s legate */
  .pill.virtual::after { content:"·"; position:absolute; }

  #porti { position:fixed; inset:0; z-index:3; pointer-events:none; }
  .poarta { position:absolute; width:26px; height:26px; border-radius:50%;
    transform:translate(-50%,-50%); cursor:pointer; pointer-events:auto;
    border:2px solid rgba(255,255,255,0.6); background:rgba(0,0,0,0.3);
    backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px);
    transition:border-color .35s ease, background .35s ease, box-shadow .35s ease; touch-action:manipulation; }
  .poarta::before { content:""; position:absolute; inset:-11px; border-radius:50%; }
  .poarta::after { content:""; position:absolute; inset:0; margin:auto; width:4px; height:4px;
    border-radius:50%; background:rgba(255,255,255,0.55); transition:background .35s ease, box-shadow .35s ease; }
  .poarta:active { transform:translate(-50%,-50%) scale(0.9); }
  .poarta.on { border-color:#ffd27a; background:rgba(255,180,70,0.42);
    box-shadow:0 0 20px 4px rgba(255,179,71,0.85); }
  .poarta.on::after { background:#fff; box-shadow:0 0 8px rgba(255,255,255,0.9); }

  /* bara de stare conexiune (jos) */
  #status { position:fixed; bottom:calc(3vh + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    z-index:4; font-size:11px; letter-spacing:0.5px; color:rgba(255,255,255,0.75);
    background:rgba(0,0,0,0.4); padding:5px 14px; border-radius:20px; backdrop-filter:blur(4px);
    display:flex; align-items:center; gap:7px; cursor:pointer; }
  #status .dot { width:8px; height:8px; border-radius:50%; background:#888; transition:background .3s; }
  #status.ok  .dot { background:#41d16b; box-shadow:0 0 8px #41d16b; }
  #status.bad .dot { background:#e0564e; box-shadow:0 0 8px #e0564e; }
  #status.wait .dot { background:#e8b84b; box-shadow:0 0 8px #e8b84b; }

  /* ecran token */
  #login { position:fixed; inset:0; z-index:10; background:rgba(8,11,20,0.92);
    backdrop-filter:blur(8px); display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px; }
  #login.show { display:flex; }
  #login h2 { color:#fff; font-size:18px; font-weight:600; }
  #login p { color:rgba(255,255,255,0.6); font-size:13px; text-align:center; max-width:320px; line-height:1.5; }
  #login input { width:min(90%,340px); padding:14px 16px; border-radius:12px; border:1.5px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.08); color:#fff; font-size:14px; text-align:center; }
  #login input:focus { outline:none; border-color:#ffcf6b; }
  #login button { width:min(90%,340px); padding:14px; border-radius:12px; border:none; cursor:pointer;
    background:#ffb347; color:#1a1205; font-size:16px; font-weight:700; }
  #login .err { color:#ff8a80; font-size:13px; min-height:16px; }
</style>
</head>
<body>
  <img id="bg" src="background.jpg" alt="">
  <div id="glows"></div>
  <div id="cerlayer"></div>
  <div id="porti"></div>
  <div id="status" class="wait"><span class="dot"></span><span id="statusText">Conectare…</span></div>
  <div id="sus"></div>

  <div id="login">
    <h2>Gabi Rometal — Control</h2>
    <p>Lipeste token-ul flespi pentru a controla luminile. Se salveaza pe acest telefon, nu il mai ceri data viitoare.</p>
    <input id="pass" type="password" placeholder="Token flespi" autocomplete="off" spellcheck="false">
    <div class="err" id="loginErr"></div>
    <button id="loginBtn">Conecteaza</button>
  </div>

<!-- biblioteca MQTT -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
<script>
  // ============================================================
  //  CONFIG BROKER (flespi)  —  token-ul NU e aici (il ceri la login)
  //  flespi: username = token, password gol. WSS pe 443.
  // ============================================================
  const MQTT = {
    host: "mqtt.flespi.io",
    port: 443,
    path: "",              // => wss://mqtt.flespi.io:443
  };

  // ------------------------------------------------------------
  //  DISPOZITIVE
  //  Pune "shelly" (prefixul MQTT al unui Shelly) + "ch" (canalul, de obicei 0)
  //  pe o lumina ca sa o legi la releu real. Fara "shelly" = buton doar vizual.
  //  Ca sa adaugi un Shelly nou mai tarziu: completezi shelly+ch pe linia lui.
  // ------------------------------------------------------------
  const LUMINI = [
    { id:"iesire-spate", nume:"Lumina iesire spate", shelly:"shelly1minig3-d885ac09bb60", ch:0 },
    { id:"spate",        nume:"Lumina spate" },
    { id:"fata",         nume:"Lumina fata" },
    { id:"birou",        nume:"Lumina birou" },
    { id:"stanga",       nume:"Lumina stanga atelier",  geamuri:"stanga" },
    { id:"dreapta",      nume:"Lumina dreapta atelier", geamuri:"dreapta" },
  ];
  const PORTI = [
    // porti: fara Shelly inca -> doar vizuale. Cand pui un Shelly pe poarta,
    // adaugi shelly+ch; pentru poarta probabil vei folosi "toggle" (vezi comanda()).
    { id:"poarta-mica", fx:0.713, fy:0.571 },
    { id:"poarta-mare", fx:0.825, fy:0.571 },
  ];

  // Topicuri Shelly (Gen3, MQTT Control):
  //   comanda -> <prefix>/command/switch:<ch>   payload "on"/"off" (sau "toggle")
  //   stare   -> <prefix>/status/switch:<ch>    JSON cu { output: true/false }
  const CMD = d => d.shelly + "/command/switch:" + (d.ch||0);
  const ST  = d => d.shelly + "/status/switch:"  + (d.ch||0);

  const GEAMURI = {
    stanga: [ { fx:0.021, fy:0.497, fw:0.072, fh:0.036 } ],
    dreapta:[ { fx:0.223, fy:0.499, fw:0.042, fh:0.026 },
              { fx:0.361, fy:0.499, fw:0.043, fh:0.027 } ],
  };
  const LAMPI = {
    fata:  [ { fx:0.632, fy:0.472, r:0.055 } ],
    birou: [ { fx:0.020, fy:0.605, r:0.130 } ],
  };
  const CER = {
    "iesire-spate": [ { fx:0.12, fy:0.40, rx:0.26, ry:0.15 } ],
    spate:          [ { fx:0.50, fy:0.40, rx:0.26, ry:0.15 } ],
  };
  const SILUETA = [
    {fx:0.00,fy:0.460},{fx:0.07,fy:0.423},{fx:0.20,fy:0.436},{fx:0.42,fy:0.455},
    {fx:0.60,fy:0.452},{fx:0.64,fy:0.433},{fx:0.75,fy:0.400},{fx:0.88,fy:0.423},{fx:1.00,fy:0.445}
  ];

  const bg=document.getElementById("bg"), glows=document.getElementById("glows");
  const cerlayer=document.getElementById("cerlayer");
  const portiL=document.getElementById("porti"), sus=document.getElementById("sus");
  const stare={}, geamEls={}, lampaEls={}, cerEls={}, poartaEls={}, pillEls={};
  const DEV={};  // lookup id -> dispozitiv
  [...LUMINI, ...PORTI].forEach(d=> DEV[d.id]=d);

  Object.keys(GEAMURI).forEach(g=>{ geamEls[g]=GEAMURI[g].map(()=>{ const el=document.createElement("div"); el.className="geam"; glows.appendChild(el); return el; }); });
  Object.keys(LAMPI).forEach(g=>{ lampaEls[g]=LAMPI[g].map(()=>{ const el=document.createElement("div"); el.className="lampa"; glows.appendChild(el); return el; }); });
  Object.keys(CER).forEach(g=>{ cerEls[g]=CER[g].map(()=>{ const el=document.createElement("div"); el.className="cer"; cerlayer.appendChild(el); return el; }); });

  // ---- construieste butoanele ----
  LUMINI.forEach(b=>{
    stare[b.id]=false;
    const el=document.createElement("button"); el.className="pill"; el.textContent=b.nume;
    if(!b.shelly) el.classList.add("virtual");   // lumina inca nelegata
    el.addEventListener("click", ()=>comanda(b.id, !stare[b.id]));
    sus.appendChild(el); pillEls[b.id]=el;
  });
  PORTI.forEach(p=>{
    stare[p.id]=false;
    const el=document.createElement("div"); el.className="poarta";
    el.addEventListener("click", ()=>comanda(p.id, !stare[p.id], true));
    portiL.appendChild(el); poartaEls[p.id]=el;
  });

  // ---- aplica starea vizuala pentru un id ----
  function aplica(id, on){
    stare[id]=on;
    if(pillEls[id]) pillEls[id].classList.toggle("on", on);
    if(poartaEls[id]) poartaEls[id].classList.toggle("on", on);
    if(geamEls[id]) geamEls[id].forEach(g=>g.classList.toggle("on", on));
    if(lampaEls[id]) lampaEls[id].forEach(g=>g.classList.toggle("on", on));
    if(cerEls[id]) cerEls[id].forEach(g=>g.classList.toggle("on", on));
  }

  // ---- la apasare: publica comanda + feedback vizual imediat ----
  function comanda(id, on, poarta){
    aplica(id, on);                       // feedback imediat
    if(navigator.vibrate) navigator.vibrate(15);
    const d = DEV[id];
    if(client && client.connected && d && d.shelly){
      // porti: cand vei lega un Shelly, poate vrei "toggle" in loc de on/off.
      const payload = on ? "on" : "off";
      client.publish(CMD(d), payload);
    }
    // fara Shelly (lumini nelegate inca / porti) -> doar vizual, nu publica
  }

  // ---- pozitionare ancorata de imagine ----
  function aseaza(){
    const natW=bg.naturalWidth, natH=bg.naturalHeight; if(!natW) return;
    const bw=window.innerWidth, bh=window.innerHeight;
    const scale=Math.max(bw/natW, bh/natH), dw=natW*scale, dh=natH*scale;
    const ox=(bw-dw)/2, oy=(bh-dh)/2;
    const X=fx=>(ox+fx*dw), Y=fy=>(oy+fy*dh);
    Object.keys(GEAMURI).forEach(g=>{ GEAMURI[g].forEach((w,i)=>{ const el=geamEls[g][i];
      el.style.left=X(w.fx)+"px"; el.style.top=Y(w.fy)+"px"; el.style.width=(w.fw*dw)+"px"; el.style.height=(w.fh*dh)+"px"; }); });
    Object.keys(LAMPI).forEach(g=>{ LAMPI[g].forEach((w,i)=>{ const el=lampaEls[g][i]; const d=2*w.r*dw;
      el.style.left=X(w.fx)+"px"; el.style.top=Y(w.fy)+"px"; el.style.width=d+"px"; el.style.height=d+"px"; }); });
    Object.keys(CER).forEach(g=>{ CER[g].forEach((w,i)=>{ const el=cerEls[g][i];
      el.style.left=X(w.fx)+"px"; el.style.top=Y(w.fy)+"px"; el.style.width=(2*w.rx*dw)+"px"; el.style.height=(2*w.ry*dw)+"px"; }); });
    PORTI.forEach(p=>{ const el=poartaEls[p.id]; el.style.left=X(p.fx)+"px"; el.style.top=Y(p.fy)+"px"; });
    let pts=["0px 0px", bw+"px 0px"];
    for(let i=SILUETA.length-1;i>=0;i--){ pts.push(X(SILUETA[i].fx).toFixed(1)+"px "+Y(SILUETA[i].fy).toFixed(1)+"px"); }
    cerlayer.style.clipPath="polygon("+pts.join(", ")+")";
    cerlayer.style.webkitClipPath=cerlayer.style.clipPath;
  }
  bg.addEventListener("load", aseaza);
  window.addEventListener("resize", aseaza);
  window.addEventListener("orientationchange", ()=>setTimeout(aseaza,200));
  if(window.visualViewport) window.visualViewport.addEventListener("resize", aseaza);
  if(bg.complete) aseaza();

  // ============================================================
  //  MQTT
  // ============================================================
  const statusEl=document.getElementById("status"), statusText=document.getElementById("statusText");
  const loginEl=document.getElementById("login"), passEl=document.getElementById("pass");
  const loginErr=document.getElementById("loginErr"), loginBtn=document.getElementById("loginBtn");
  let client=null, connectTimer=null;

  function setStatus(cls, txt){ statusEl.className=cls; statusText.textContent=txt; }

  function conecteaza(token){
    setStatus("wait","Conectare…");
    const url = "wss://"+MQTT.host+":"+MQTT.port+MQTT.path;
    const opts = {
      username: token,         // flespi: token = username
      password: "",            // flespi: parola nefolosita
      clientId: "web_"+Math.random().toString(16).slice(2,10),
      clean: true,
      reconnectPeriod: 3000,
      connectTimeout: 8000,
      protocolVersion: 4,
    };
    try { client = mqtt.connect(url, opts); } catch(e){ setStatus("bad","Eroare"); return; }

    // daca nu se conecteaza in 9s -> probabil token gresit
    clearTimeout(connectTimer);
    connectTimer = setTimeout(()=>{
      if(!client || !client.connected){
        try{ client.end(true); }catch(e){}
        localStorage.removeItem("flespi_token");
        loginErr.textContent="Nu s-a conectat — verifica token-ul.";
        loginEl.classList.add("show");
        setStatus("bad","Deconectat");
      }
    }, 9000);

    client.on("connect", ()=>{
      clearTimeout(connectTimer);
      setStatus("ok","Conectat");
      loginEl.classList.remove("show");
      // asculta starea reala a luminilor legate la Shelly
      [...LUMINI, ...PORTI].forEach(d=>{ if(d.shelly) client.subscribe(ST(d)); });
    });

    client.on("message", (topic, msg)=>{
      [...LUMINI, ...PORTI].forEach(d=>{
        if(d.shelly && topic === ST(d)){
          let on=false;
          try {
            const j = JSON.parse(msg.toString());      // Shelly trimite JSON
            on = (j.output === true);
          } catch(e){
            const m = msg.toString().toLowerCase();    // fallback text simplu
            on = (m==="on" || m==="true" || m==="1" || m==="open");
          }
          aplica(d.id, on);
        }
      });
    });

    client.on("error", (err)=>{
      const s=(err&&err.message||"").toLowerCase();
      if(s.includes("not authorized") || s.includes("bad user") || s.includes("password")
         || s.includes("token") || s.includes("4") || s.includes("5")){
        clearTimeout(connectTimer);
        try{ client.end(true); }catch(e){}
        localStorage.removeItem("flespi_token");
        loginErr.textContent="Token gresit.";
        loginEl.classList.add("show");
        setStatus("bad","Token gresit");
      } else {
        setStatus("bad","Eroare retea");
      }
    });

    client.on("reconnect", ()=> setStatus("wait","Reconectare…"));
    client.on("close", ()=>{ if(statusEl.className!=="ok") setStatus("bad","Deconectat"); });
    client.on("offline", ()=> setStatus("bad","Offline"));
  }

  // login
  loginBtn.addEventListener("click", ()=>{
    const p=passEl.value.trim(); if(!p) return;
    loginErr.textContent="";
    localStorage.setItem("flespi_token", p);
    if(client){ try{ client.end(true); }catch(e){} client=null; }
    conecteaza(p);
  });
  passEl.addEventListener("keydown", e=>{ if(e.key==="Enter") loginBtn.click(); });

  // apasare lunga pe bara de stare = sterge token-ul salvat (schimbare token)
  let pressTimer=null;
  statusEl.addEventListener("pointerdown", ()=>{ pressTimer=setTimeout(()=>{
    localStorage.removeItem("flespi_token");
    if(client){ try{ client.end(true); }catch(e){} client=null; }
    passEl.value=""; loginErr.textContent="Token sters. Lipeste din nou.";
    loginEl.classList.add("show");
  }, 1000); });
  statusEl.addEventListener("pointerup", ()=> clearTimeout(pressTimer));
  statusEl.addEventListener("pointerleave", ()=> clearTimeout(pressTimer));

  // pornire: daca avem token salvat, conecteaza; altfel cere-l
  const saved = (function(){ try{ return localStorage.getItem("flespi_token"); }catch(e){ return null; } })();
  if(saved) conecteaza(saved);
  else { loginEl.classList.add("show"); setStatus("bad","Neconectat"); }

  if("serviceWorker" in navigator)
    window.addEventListener("load", ()=>navigator.serviceWorker.register("service-worker.js").catch(()=>{}));
</script>
</body>
</html>
